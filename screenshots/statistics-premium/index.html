<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-family:var(--font-sans,sans-serif);color:var(--foreground)}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}button,select{font:inherit;font-size:13px;min-height:38px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius,8px);background:var(--card);color:var(--foreground);cursor:pointer}button[aria-pressed="true"]{background:var(--secondary);border-color:var(--ring)}button:focus-visible,select:focus-visible{outline:2px solid var(--ring);outline-offset:3px}select{margin-left:auto;max-width:100%}.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}figure{margin:0;min-width:0}figcaption{font-size:13px;font-weight:600;margin-bottom:8px}img{display:block;width:100%;height:auto;border-radius:var(--radius,8px)}.note{font-size:12px;color:var(--muted-foreground);margin-top:10px}
</style></head><body><div class="controls" aria-label="Screenshot display"><button id="dark" aria-pressed="true" onclick="mode='dark';update()">Dark</button><button id="light" aria-pressed="false" onclick="mode='light';update()">Light</button><select id="pair" aria-label="Screens" onchange="update()"><option value="0">Overview &amp; Strength</option><option value="1">Blocks &amp; Records</option></select></div>
<div class="shots" data-mode="dark" data-pair="0"><figure><figcaption>Overview</figcaption><img src="/home/aalish/projects/OpenGym/screenshots/statistics-premium/overview-dark.png" alt="Overview screen in dark mode"></figure><figure><figcaption>Strength</figcaption><img src="/home/aalish/projects/OpenGym/screenshots/statistics-premium/strength-dark.png" alt="Strength screen in dark mode"></figure></div><div class="shots" data-mode="dark" data-pair="1" hidden><figure><figcaption>Blocks</figcaption><img src="/home/aalish/projects/OpenGym/screenshots/statistics-premium/blocks-dark.png" alt="Blocks screen in dark mode"></figure><figure><figcaption>Records</figcaption><img src="/home/aalish/projects/OpenGym/screenshots/statistics-premium/records-dark.png" alt="Records screen in dark mode"></figure></div><div class="shots" data-mode="light" data-pair="0" hidden><figure><figcaption>Overview</figcaption><img src="/home/aalish/projects/OpenGym/screenshots/statistics-premium/overview-light.png" alt="Overview screen in light mode"></figure><figure><figcaption>Strength</figcaption><img src="/home/aalish/projects/OpenGym/screenshots/statistics-premium/strength-light.png" alt="Strength screen in light mode"></figure></div><div class="shots" data-mode="light" data-pair="1" hidden><figure><figcaption>Blocks</figcaption><img src="/home/aalish/projects/OpenGym/screenshots/statistics-premium/blocks-light.png" alt="Blocks screen in light mode"></figure><figure><figcaption>Records</figcaption><img src="/home/aalish/projects/OpenGym/screenshots/statistics-premium/records-light.png" alt="Records screen in light mode"></figure></div>
<div class="note">Android emulator captures. Blocks uses read-only preview data.</div><script>let mode='dark';function update(){document.getElementById('dark').setAttribute('aria-pressed',String(mode==='dark'));document.getElementById('light').setAttribute('aria-pressed',String(mode==='light'));document.querySelectorAll('.shots').forEach(grid=>grid.hidden=grid.dataset.mode!==mode||grid.dataset.pair!==document.getElementById('pair').value);}</script></body></html>
