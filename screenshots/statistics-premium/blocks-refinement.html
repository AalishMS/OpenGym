<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:var(--font-sans,sans-serif);color:var(--foreground)}
.controls{display:flex;gap:8px;margin-bottom:14px}
button{font:inherit;font-size:13px;min-height:38px;padding:8px 16px;background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius,8px);cursor:pointer}
button[aria-pressed=true]{background:var(--secondary);border-color:var(--ring)}
button:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
figure{margin:0;min-width:0}figcaption{font-size:13px;font-weight:600;margin-bottom:8px}
img{display:block;width:100%;height:auto;border-radius:var(--radius,8px)}
.note{margin-top:10px;font-size:12px;color:var(--muted-foreground)}
</style></head><body>
<div class="controls" aria-label="Appearance"><button id="dark" aria-pressed="true" onclick="choose('dark')">Dark</button><button id="light" aria-pressed="false" onclick="choose('light')">Light</button></div>
<div class="shots" data-mode="dark">
<figure><figcaption>Across blocks</figcaption><img src="/home/aalish/projects/OpenGym/screenshots/statistics-premium/blocks-dark.png" alt="New Blocks view with a scrollable line graph across training blocks in dark mode"></figure>
<figure><figcaption>Block detail</figcaption><img src="/home/aalish/projects/OpenGym/screenshots/statistics-premium/blocks-detail-dark.png" alt="Spacious two-column totals, weekly workload, and strength gains in dark mode"></figure></div><div class="shots" data-mode="light" hidden>
<figure><figcaption>Across blocks</figcaption><img src="/home/aalish/projects/OpenGym/screenshots/statistics-premium/blocks-light.png" alt="New Blocks view with a scrollable line graph across training blocks in light mode"></figure>
<figure><figcaption>Block detail</figcaption><img src="/home/aalish/projects/OpenGym/screenshots/statistics-premium/blocks-detail-light.png" alt="Spacious two-column totals, weekly workload, and strength gains in light mode"></figure></div>
<div class="note">Actual Android screens with read-only seven-block preview data.</div>
<script>function choose(mode){document.querySelectorAll('[data-mode]').forEach(el=>el.hidden=el.dataset.mode!==mode);['dark','light'].forEach(name=>document.getElementById(name).setAttribute('aria-pressed',String(name===mode)));}</script>
</body></html>
