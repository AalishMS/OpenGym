name: gymapp
description: "A mobile gym tracking app for workout logging"
publish_to: 'none'
version: 1.0.1+2

environment:
  # Floor raised from ^3.5.4 because ota_update 7.1.0 requires Dart >=3.7.0.
  # The old floor let an SDK too old for that package resolve silently to an
  # ancient version of it instead of failing, which would have bitten CI rather
  # than a local build.
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  fl_chart: ^0.66.0
  google_fonts: ^6.0.0
  lucide_icons_flutter: ^3.1.17
  file_picker: ^8.1.6
  share_plus: ^10.1.4
  uuid: ^4.3.0
  supabase_flutter: ^2.5.0
  # In-app updater: query the GitHub Releases API, read the installed version,
  # then download and hand off to the installer.
  #
  # There is deliberately no permission_handler here. It wanted 30+ permission
  # handlers and compileSdk 37 to give us one boolean; the "install unknown
  # apps" check is canRequestPackageInstalls(), which MainActivity exposes over
  # the MethodChannel it already had.
  http: ^1.6.0
  # Held at 9.x: package_info_plus 10.x needs win32 ^6.0.1 while share_plus
  # 10.1.4 needs win32 ^5.5.3. Bumping share_plus instead is a breaking API
  # change to the working export flow, and 9.x reads version/buildNumber the
  # same way, so there is nothing to gain by forcing it.
  package_info_plus: ^9.0.1
  ota_update: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - logo/
